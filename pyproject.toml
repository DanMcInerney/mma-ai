[project]
name = "mma-ai"
version = "0.1.0"
description = "Dockerized UFC fight data, training, analytics, and prediction dashboard"
requires-python = ">=3.10,<3.13"
dependencies = [
    # --- Core ---
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    
    # --- Database ---
    "sqlalchemy>=2.0.0",
    "sqlalchemy-utils>=0.38.0",
    "psycopg2-binary>=2.9.5",
    
    # --- Machine Learning ---
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "catboost>=1.2.8",
    "lightgbm>=4.6.0",
    "xgboost-cpu>=2.1.1,<3.4",
    "torch==2.10.0",
    "omegaconf>=2.3.0",
    
    # --- Web & Scraping ---
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "curl-cffi>=0.5.0",
    "lxml>=4.9.0",
    "scrapy>=2.13.0",
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    
    # --- Visualization ---
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "kaleido==0.2.1",
    
    # --- Utilities ---
    "fuzzywuzzy>=0.18.0",
    "unidecode>=1.3.0",
    "tqdm>=4.64.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.0.0",
    "pillow>=9.5.0",
    "shap>=0.42.0",
    "optuna>=3.4.0",
    "optuna-dashboard>=0.13.0",
    "tabulate>=0.9.0",
    "python-levenshtein>=0.25.1",
    "autogluon.tabular[tabarena]==1.6.1",
    "google-generativeai>=0.8.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "predict"]

[tool.setuptools.packages.find]
include = ["config*", "libs*", "scripts*"]

[tool.setuptools.package-data]
"libs.web" = ["static/*"]

# --- COMMANDS ---

[project.scripts]
mma-scrape-ufcstats = "scripts.scrape_ufcstats:main"
mma-rebuild-db = "main:cli"
mma-train = "libs.modeling.train:cli"
mma-evaluate = "scripts.evaluate_model:main"
mma-predict = "predict:cli"
mma-web = "libs.web.cli:main"
mma-release-audit = "scripts.release_audit:main"
mma-docker-smoke = "scripts.docker_smoke:main"

# Stable CUDA 13 wheels for the supported Windows/Linux training hosts.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
